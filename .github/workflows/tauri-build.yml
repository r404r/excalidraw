name: Build and Public Excalidraw Tauri Application

on:
  push:
    tags:
      - "app-v*" # only build it when add app-v* tag
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        platform: [macos-latest, windows-latest] # [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: excalidraw-app
        run: yarn install

      - name: Build front-end
        working-directory: excalidraw-app
        run: yarn build

      - name: Build and Publish Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: excalidraw-app
          tagName: v${{ github.run_number }}
          releaseName: "Release v${{ github.run_number }}"
          releaseBody: "Auto build for ${{ github.run_number }}"
          releaseDraft: false
          prerelease: false
