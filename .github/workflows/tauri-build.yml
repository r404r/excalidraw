name: Build and Public Excalidraw Tauri Application

on:
  push:
    tags:
      - "release/v*" # only build it when add app-v* tag
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-latest] # [macos-latest, windows-latest, ubuntu-latest]
      fail-fast: false  # true: (or its expression evaluates to true) GitHub will cancel all in-progress and queued jobs in the matrix if any job in the matrix fails. 
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
    
      - name: Enable Corepack # for yarn version error
        run: corepack enable

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # --- Add: for Ubuntu build task ---
      - name: Install Linux dependencies (for Ubuntu platform)
        if: matrix.platform == 'ubuntu-latest' # only run in Ubuntu runner
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      # --- end for ubuntu dependencies ---

      - name: Install dependencies  # working-directory: excalidraw-app
        run: yarn install

      # Build the front-end for verification with the exact same env the
      # packaging step uses (real commit SHA, Tauri mode). The Tauri step
      # below rebuilds via beforeBuildCommand from the same source and env,
      # so the bundle verified here matches what ships.
      - name: Build front-end  # working-directory: excalidraw-app
        run: yarn workspace excalidraw-app build
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }} # set env paramater
          VITE_APP_TAURI: "true" # disable PWA/service-worker caching in the desktop app

      # Guard: fail the release before packaging if the built bundle is missing
      # the Preferences menu code or still carries the local-dev SHA. Runs on
      # all platforms via git-bash (shell: bash).
      - name: Verify front-end bundle before packaging
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="excalidraw-app/build/assets"
          if [ ! -d "$ASSETS" ]; then
            echo "::error::Build output '$ASSETS' not found"; exit 1
          fi
          if ! grep -rq "excalidraw-main-menu-preferences-submenu" "$ASSETS"; then
            echo "::error::Built bundle is missing the Preferences submenu (excalidraw-main-menu-preferences-submenu)"; exit 1
          fi
          if ! grep -rq "preferences_toolLock" "$ASSETS"; then
            echo "::error::Built bundle is missing preferences_toolLock"; exit 1
          fi
          if grep -rq "local-dev" "$ASSETS"; then
            echo "::error::Built bundle still embeds the placeholder SHA 'local-dev'"; exit 1
          fi
          echo "Bundle verification passed: Preferences menu present and SHA is not local-dev."

      # tauri.conf.json beforeBuildCommand rebuilds the front-end with
      # VITE_APP_TAURI=true (PWA disabled) and the env below, then packages it.
      - name: Build and Publish Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: excalidraw-app
          tagName: ${{ github.ref_name }} # v${{ github.run_number }}
          releaseName: "Release ${{ github.ref_name }}" # "Release v${{ github.run_number }}"
          releaseBody: "Auto build for ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }} # set env paramater
          VITE_APP_TAURI: "true" # disable PWA/service-worker caching in the desktop app
